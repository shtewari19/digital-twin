services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:-core_api}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${APP_POSTGRES_DB:-core_api}
    ports:
      - "${APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-core_api} -d ${APP_POSTGRES_DB:-core_api}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${APP_POSTGRES_USER:-core_api}
      - POSTGRES_PWD=${APP_POSTGRES_PASSWORD:-dev_password}
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=${APP_TEMPORAL_CORS_ORIGINS}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
