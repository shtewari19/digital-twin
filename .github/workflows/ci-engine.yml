name: CI (engine)

on:
  push:
    branches: [main]
    paths:
      - "apps/engine/**"
      - ".github/workflows/ci-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/engine/**"
      - ".github/workflows/ci-engine.yml"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run ruff check .
