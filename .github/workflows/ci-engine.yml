name: CI (engine)

on:
  push:
    branches: [main]
    paths:
      - "apps/engine/**"
      - ".github/workflows/ci-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/engine/**"
      - ".github/workflows/ci-engine.yml"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .
