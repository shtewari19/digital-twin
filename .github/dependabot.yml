version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/apps/engine"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  # actions/checkout, actions/setup-python, etc. across every workflow file
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
