[project]
name = "digital-twin-engine"
version = "0.1.0"
description = "SSR pipeline workers. Not implemented yet — see README.md."
requires-python = ">=3.14"
dependencies = [
    "temporalio>=1.7",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"
