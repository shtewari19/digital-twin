[project]
name = "digital-twin-engine"
version = "0.1.0"
description = "SSR pipeline workers. Not implemented yet — see README.md."
requires-python = ">=3.14"
dependencies = [
    "temporalio>=1.7",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.29",
    "numpy>=1.26",
    "requests>=2.31",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# "app*" is where the real code lives (config.py, activities.py, worker.py,
# workflows/); "engine*" is a leftover placeholder package. Both are included
# so an actual `pip install -e .` exposes app/, not just the stub.
include = ["app*", "engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
