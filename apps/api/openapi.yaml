openapi: 3.0.3
info:
  title: Questkart API
  version: 1.0.0
  description: Internal API for the SSR platform. Contract-first API for SSR — a domain-agnostic tool that simulates a target
    audience with AI avatars (personas), has them react to candidate messages, scores those reactions by meaning (SSR), and
    ranks the messages to produce a recommendation + report.
servers:
- url: https://api.questkart.example/api/v1
  description: Production
- url: http://localhost:4010
  description: Prism mock server (contract-first development)
- url: http://localhost:8000/api/v1
  description: Local development
paths:
  /api/v1/domains:
    get:
      summary: List domains
      operationId: listDomains
      responses:
        '200':
          description: A page of domains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainList'
        default:
          description: Unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          example: 20
          description: 'Max items per page. (in: query)'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          description: 'Opaque cursor from a previous page’s next_cursor. (in: query)'
    post:
      summary: Create a (custom) domain
      operationId: createDomain
      responses:
        '201':
          description: Domain created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreate'
  /api/v1/domains/{domain_id}:
    get:
      summary: Get a domain
      operationId: getDomain
      responses:
        '200':
          description: The domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: domain_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: 'in: path'
    patch:
      summary: Update a domain
      operationId: updateDomain
      responses:
        '200':
          description: Updated domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: domain_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: 'in: path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainUpdate'
    delete:
      summary: Delete a domain
      operationId: deleteDomain
      responses:
        '204':
          description: Deleted.
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: domain_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: 'in: path'
