                  $ref: '#/components/schemas/Scale'
              required:
              - outcome_dimension
              - scale
  /api/v1/credits/balance:
    get:
      summary: Get credit balance
      operationId: getCreditBalance
      responses:
        '200':
          description: Current balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
        default:
          description: Unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/credits/ledger:
    get:
      summary: Get the credit ledger
      operationId: getCreditLedger
      responses:
        '200':
          description: A page of ledger entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerList'
        default:
          description: Unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          example: 20
          description: 'Max items per page. (in: query)'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          description: 'Opaque cursor from a previous page’s next_cursor. (in: query)'
  /api/v1/usage:
    get:
      summary: Get token/cost usage
      operationId: getUsage
      responses:
        '200':
          description: Usage summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        default:
          description: Unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
          example: '2026-01-15'
          description: 'in: query'
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
          example: '2026-01-15'
          description: 'in: query'
  /api/v1/me:
    get:
      summary: Get the current user
      operationId: getMe
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Unexpected error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer authentication using Azure AD. Clients obtain an Azure AD-issued JWT access token and pass
        it in the Authorization: Bearer <access_token> header for API authentication.'
  schemas:
    Problem:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
          format: uri
          description: default about:blank
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: No study exists with that id.
        instance:
          type: string
          format: uri
          example: https://api.questkart.example/v1/exports/…
        errors:
          type: array
          items:
            type: object
          description: Field-level validation errors (when applicable).
          example:
          - '{ … }'
    PageMeta:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page, or null if none.
        has_more:
          type: boolean
          example: true
    Timestamps:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: read-only
          example: '2026-01-15T09:30:00Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: read-only
          example: '2026-01-15T09:30:00Z'
          readOnly: true
    Priority:
      type: string
      enum:
      - high
      - medium
      - low
    Scale:
      type: object
      description: The rating scale for the outcome dimension.
      properties:
        min:
          type: integer
          example: 1
        max:
          type: integer
          example: 5
      required:
      - min
      - max
    DomainType:
      type: string
      enum:
      - predefined
      - custom
    Domain:
      type: object
