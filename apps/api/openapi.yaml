            format: date-time
            description: read-only
            example: '2026-01-15T09:30:00Z'
            readOnly: true
          updated_at:
            type: string
            format: date-time
            description: read-only
            example: '2026-01-15T09:30:00Z'
            readOnly: true
          id:
            type: string
            format: uuid
            description: read-only
            example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            readOnly: true
          name:
