[project]
name = "digital-twin-api"
version = "0.1.0"
description = "FastAPI backend for the Digital Twin platform."
requires-python = ">=3.14"
dependencies = [
    "temporalio>=1.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",  # pydantic EmailStr (app/schemas/platform.py:User)
    # Auth — Entra ID JWT validation (JWKS + RS256)
    "PyJWT[crypto]>=2.9",
    "cryptography>=43",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "msal>=1.28",  # scripts/get_dev_token.py
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit rather than relying on setuptools' auto-discovery — this
# directory also has scripts/ (plain scripts, not a package), which
# auto-discovery could otherwise trip over.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness first. B (bugbear) catches the mistakes that actually bite —
# B905 in particular: a zip() without strict= silently truncates to the
# shortest input, which in this pipeline would drop scored pairs and still
# report success.
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "UP", "C4", "ARG", "RUF"]
ignore = [
    # Em dashes and arrows are used deliberately in prose docstrings.
    "RUF001", "RUF002", "RUF003",
    # `class X(str, Enum)` is intentional: the SQLAlchemy mapping relies on
    # values_callable over the members, which StrEnum would change.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# main.py configures logging before the remaining imports, on purpose;
# core/logging.py extends sys.path to reach the monorepo-root /utility package
# before importing from it.
"app/main.py" = ["E402"]
"app/core/logging.py" = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
