[project]
name = "digital-twin-api"
version = "0.1.0"
description = "FastAPI backend for the Digital Twin platform."
requires-python = ">=3.14"
dependencies = [
    "temporalio>=1.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",  # pydantic EmailStr (app/schemas/platform.py:User)
    # Auth — Entra ID JWT validation (JWKS + RS256)
    "PyJWT[crypto]>=2.9",
    "cryptography>=43",
    "python-dotenv>=1.2.2",
    # Knowledgebase vector column (core.source_chunks.embedding) + asyncpg codec.
    "pgvector>=0.3",
    # Required by FastAPI's File()/Form()/UploadFile (POST .../sources).
    "python-multipart>=0.0.9",
    # LiteLLM gateway + Langfuse tracing (see app/llm/).
    "litellm>=1.97.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "langfuse>=4.14.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit rather than relying on setuptools' auto-discovery — this
# directory also has scripts/ (plain scripts, not a package), which
# auto-discovery could otherwise trip over.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

# FastAPI's own DI pattern is `param: T = Query(...)` / `= Depends(...)` —
# bugbear's B008 otherwise flags these as "function call in argument
# default" for any non-builtin-scalar annotation (uuid.UUID, our Enums),
# even though FastAPI itself calls these before each request, safely.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "msal>=1.28",  # scripts/get_dev_token.py
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",  # starlette TestClient transport
]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# conftest must set APP_* env vars before any `app.*` import (Settings() runs
# at import time), so its imports legitimately sit below executable code.
"tests/conftest.py" = ["E402"]
